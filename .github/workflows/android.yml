name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: set these repository secrets to get a stable release signature,
      # so new builds install over old ones without losing data.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PURSE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/purse.jks"
          echo "PURSE_KEYSTORE=$RUNNER_TEMP/purse.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          PURSE_KEYSTORE_PASSWORD: ${{ secrets.PURSE_KEYSTORE_PASSWORD }}
          PURSE_KEY_ALIAS: ${{ secrets.PURSE_KEY_ALIAS }}
          PURSE_KEY_PASSWORD: ${{ secrets.PURSE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: purse-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
